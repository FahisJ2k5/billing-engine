[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-engine"
version = "0.1.0"
description = "Itemised utility invoices from meter readings and mid-cycle events, using exact decimal arithmetic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "coverage>=7.5"]

[project.scripts]
billing-engine = "billing_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billing_engine = ["py.typed"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
